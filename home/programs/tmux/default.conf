# NOTE: default-command / default-shell are NOT set here — they are injected from
# nix in ./default.nix as an absolute store path. Hardcoding
# $HOME/.nix-profile/bin/fish worked on Darwin (standalone home-manager) but is a
# dead path on the NixOS containers, where home-manager uses `useUserPackages`
# and installs into /etc/profiles/per-user/<name>/bin instead. A dead
# default-command kills every pane the instant it spawns, so the session dies and
# the server exits — which made tmux unusable there.

# Enable 24-bit true color and ligature support
set -ga terminal-overrides ",*:Tc,*:ss=\\E[%p1%d q:se=\\E[2 q"

# Let OSC 52 through, so `kitten clipboard` run ON a remote box sets the LOCAL
# Mac clipboard even when the shell is inside tmux.
set -g set-clipboard on

# Let unrecognised escape sequences through to the terminal (tmux >= 3.3). Needed
# by the kittens that talk to kitty directly: `icat` (images), `kitten transfer`
# (file transfer over the ssh connection), `kitten notify`.
set -g allow-passthrough on

# automatically renumber tmux windows
set -g renumber-windows on

# Activity Monitoring
setw -g monitor-activity off
set -g visual-activity off

# make delay shorter
set -sg escape-time 0

# make window/pane index start with 1
setw -g pane-base-index 1

############ Key Bindings ############

# reload config file — Home Manager writes ~/.config/tmux/tmux.conf, NOT the
# legacy ~/.tmux.conf, which does not exist here (so `prefix r` was a no-op error).
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# split window and fix path for tmux 1.9
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# synchronize all panes in a window
bind y setw synchronize-panes

bind C-c new-session

# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10

# Remap x to avoid confirmation to kill pane
bind-key x kill-pane

# Move windows
bind-key S-Left swap-window -t -1\; select-window -t -1
bind-key S-Right swap-window -t +1\; select-window -t +1
